<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Uszy (czarne, za głową) -->
  <circle cx="13" cy="17" r="10" fill="#1a1a1a"/>
  <circle cx="51" cy="17" r="10" fill="#1a1a1a"/>
  <!-- Wewnętrzna część uszu -->
  <circle cx="13" cy="17" r="5" fill="#444"/>
  <circle cx="51" cy="17" r="5" fill="#444"/>

  <!-- Głowa (biała) -->
  <circle cx="32" cy="35" r="24" fill="#f0f0f0"/>

  <!-- Plamy oczu (czarne) -->
  <ellipse cx="22" cy="29" rx="8" ry="7" fill="#1a1a1a" transform="rotate(-12 22 29)"/>
  <ellipse cx="42" cy="29" rx="8" ry="7" fill="#1a1a1a" transform="rotate(12 42 29)"/>

  <!-- Białka oczu -->
  <circle cx="22" cy="28" r="3.5" fill="white"/>
  <circle cx="42" cy="28" r="3.5" fill="white"/>

  <!-- Źrenice -->
  <circle cx="22" cy="28" r="2" fill="#1a1a1a"/>
  <circle cx="42" cy="28" r="2" fill="#1a1a1a"/>

  <!-- Błyski w oczach -->
  <circle cx="23" cy="27" r="0.8" fill="white"/>
  <circle cx="43" cy="27" r="0.8" fill="white"/>

  <!-- Nos -->
  <ellipse cx="32" cy="38" rx="4" ry="2.5" fill="#1a1a1a"/>

  <!-- Usta -->
  <path d="M28 41 Q32 46 36 41" stroke="#1a1a1a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <line x1="32" y1="38" x2="32" y2="41" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round"/>
</svg>
